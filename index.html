<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f7fa">

<title>Masa Almazloum – Notfallkontakt</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,#f7f9fc 0%,#eef2f7 100%);
  color:#1f2937;
  min-height:100vh;
  padding:28px 16px;
}

.card{
  max-width:430px;
  margin:auto;
  background:#fff;
  border-radius:26px;
  padding:28px 20px;
  box-shadow:0 12px 35px rgba(0,0,0,.10);
}

h1{
  margin:0 0 24px;
  text-align:center;
  font-size:28px;
  font-weight:800;
}

.section{
  background:#f8fafc;
  border-radius:20px;
  padding:18px;
  margin-bottom:16px;
}

.label{
  font-size:13px;
  font-weight:700;
  color:#64748b;
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-bottom:6px;
}

.name{
  font-size:19px;
  font-weight:700;
  margin-bottom:12px;
}

.actions{
  display:flex;
  gap:9px;
}

.btn{
  flex:1;
  text-decoration:none;
  text-align:center;
  padding:12px 8px;
  border-radius:13px;
  color:white;
  font-weight:700;
  font-size:14px;
}

.call{
  background:#16a34a;
}

.whatsapp{
  background:#22c55e;
}

.address{
  line-height:1.7;
  font-size:17px;
  font-weight:600;
}

.pin{
  font-size:20px;
  margin-right:6px;
}

.footer{
  text-align:center;
  color:#94a3b8;
  font-size:12px;
  margin-top:20px;
}
</style>
</head>

<body>

href="https://wa.me/491739230929">

</a>
